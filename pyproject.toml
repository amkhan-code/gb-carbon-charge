[project]
name = "gb-carbon-charge"
version = "0.1.0"
description = "Day-ahead GB carbon intensity forecasting for EV charge scheduling"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "holidays>=0.105",
    "httpx>=0.27",
    "lightgbm>=4.7.0",
    "pandas>=2.2",
    "typer>=0.12",
]

[project.scripts]
carbon-charge = "carbon_charge.cli:app"

[dependency-groups]
dev = ["pytest>=8", "scipy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbon_charge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
