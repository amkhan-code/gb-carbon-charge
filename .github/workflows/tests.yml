name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: OpenMP runtime for LightGBM
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: uv sync --python 3.12 --frozen
      - run: uv run pytest -q
