name: Log day-ahead wind forecast

# NESO refreshes this file around 08:40 UTC. 09:15 UTC runs after that and still leaves 45 minutes
# before the 10:00 UTC cutoff (summer). The issue time recorded is NESO's own last-modified time, so a
# late run is harmless unless NESO refreshed again after the cutoff, in which case the snapshot is
# correctly ignored by the leakage gate.
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Snapshot day-ahead wind forecast to CSV
        run: uv run --python 3.12 carbon-charge log-wind --out-dir "$RUNNER_TEMP/snapshot"

      - name: Commit snapshot to the data branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add "$RUNNER_TEMP/data" data
            git -C "$RUNNER_TEMP/data" reset --hard origin/data
          else
            git worktree add --detach "$RUNNER_TEMP/data"
            git -C "$RUNNER_TEMP/data" checkout --orphan data
            git -C "$RUNNER_TEMP/data" rm -rf --quiet . || true
          fi

          year=$(date -u +%Y)
          mkdir -p "$RUNNER_TEMP/data/wind_forecast/$year"
          cp "$RUNNER_TEMP"/snapshot/wind_forecast_*.csv "$RUNNER_TEMP/data/wind_forecast/$year/"

          cd "$RUNNER_TEMP/data"
          git add wind_forecast
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Wind forecast snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:data
          fi
